# Render Blueprint — Webhook chatbot Almacén Impulsora (plan gratuito, sin tarjeta)
# Uso: en Render Dashboard → New → Blueprint → conectar el repo de GitHub.
# Las variables marcadas sync: false se ponen a mano en el panel de Render
# (Environment) después del despliegue; NUNCA van en el repo.
services:
  - type: web
    name: chatbot-taller-almacen-impulsora
    env: node
    plan: free
    buildCommand: "npm install --omit=dev || true"
    startCommand: node server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: PHONE_NUMBER_ID
        value: "818620465684599"
      - key: MONTHLY_CAP
        value: "1000"
      - key: GRAPH_VERSION
        value: v21.0
      - key: VERIFY_TOKEN
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: APP_SECRET
        sync: false
